name: Floom
description: Floom is a curated online marketplace for flowers and plants that connects customers with
  a vetted network of independent local florists, enabling same-day and next-day delivery of designer
  bouquets, arrangements, and gifts across the United Kingdom and United States. Rather than operating
  central warehouses, Floom routes each order to a nearby artisan florist, and also provides those
  florists with e-commerce, ordering, and fulfillment technology to run and grow their businesses online.
